<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD93D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle representing community -->
  <circle cx="100" cy="100" r="95" fill="url(#coldGradient)" opacity="0.1"/>
  
  <!-- House/Shelter shape -->
  <g id="house">
    <!-- Roof -->
    <path d="M 100 30 L 160 80 L 40 80 Z" fill="url(#warmGradient)" stroke="#333" stroke-width="2"/>
    
    <!-- House body -->
    <rect x="50" y="80" width="100" height="80" fill="#fff" stroke="#333" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="85" y="115" width="30" height="45" fill="url(#coldGradient)" stroke="#333" stroke-width="1.5" rx="3"/>
    <circle cx="108" cy="140" r="2" fill="#FFD93D"/>
    
    <!-- Windows -->
    <rect x="60" y="95" width="20" height="20" fill="#E3F2FD" stroke="#333" stroke-width="1.5" rx="2"/>
    <line x1="70" y1="95" x2="70" y2="115" stroke="#333" stroke-width="1"/>
    <line x1="60" y1="105" x2="80" y2="105" stroke="#333" stroke-width="1"/>
    
    <rect x="120" y="95" width="20" height="20" fill="#E3F2FD" stroke="#333" stroke-width="1.5" rx="2"/>
    <line x1="130" y1="95" x2="130" y2="115" stroke="#333" stroke-width="1"/>
    <line x1="120" y1="105" x2="140" y2="105" stroke="#333" stroke-width="1"/>
  </g>
  
  <!-- Warmth waves/heat emanating from house -->
  <g id="warmth" opacity="0.8">
    <path d="M 70 170 Q 65 175 70 180" stroke="url(#warmGradient)" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 100 170 Q 95 175 100 180" stroke="url(#warmGradient)" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 130 170 Q 125 175 130 180" stroke="url(#warmGradient)" stroke-width="3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Heart symbol representing care -->
  <g id="heart" transform="translate(155, 45)">
    <path d="M 0 8 C 0 4 4 0 8 0 C 10 0 12 2 12 2 C 12 2 14 0 16 0 C 20 0 24 4 24 8 C 24 14 12 22 12 22 C 12 22 0 14 0 8 Z" fill="#FF6B6B" stroke="#fff" stroke-width="1">
      <animate attributeName="transform" values="scale(1) translate(0,0); scale(1.1) translate(-1,-1); scale(1) translate(0,0)" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Text curved around bottom -->
  <path id="textPath" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">
      WARMING ROOM
    </textPath>
  </text>
</svg>
