<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="suppGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C2185B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Heart symbol -->
  <path d="M 50 75 C 50 75 25 55 25 40 C 25 30 32 25 40 25 C 45 25 48 28 50 32 C 52 28 55 25 60 25 C 68 25 75 30 75 40 C 75 55 50 75 50 75 Z" fill="url(#suppGrad)"/>
  <!-- Hands supporting -->
  <path d="M 30 80 Q 25 75 25 70 L 30 68 Q 32 70 35 75" fill="#FFD93D" stroke="#F57C00" stroke-width="1.5"/>
  <path d="M 70 80 Q 75 75 75 70 L 70 68 Q 68 70 65 75" fill="#FFD93D" stroke="#F57C00" stroke-width="1.5"/>
  <!-- Pulse animation -->
  <animate attributeName="opacity" values="1;0.8;1" dur="1.5s" repeatCount="indefinite"/>
</svg>
