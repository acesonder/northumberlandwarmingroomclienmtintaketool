<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Medical cross -->
  <rect x="40" y="20" width="20" height="60" rx="3" fill="url(#medGrad)"/>
  <rect x="20" y="40" width="60" height="20" rx="3" fill="url(#medGrad)"/>
  <!-- White center -->
  <rect x="45" y="25" width="10" height="50" rx="2" fill="white" opacity="0.3"/>
  <rect x="25" y="45" width="50" height="10" rx="2" fill="white" opacity="0.3"/>
  <!-- Heart beat line -->
  <path d="M 10 85 L 25 85 L 30 75 L 35 95 L 40 85 L 50 85" stroke="#F44336" stroke-width="2.5" fill="none" stroke-linecap="round">
    <animate attributeName="opacity" values="1;0.5;1" dur="1s" repeatCount="indefinite"/>
  </path>
</svg>
