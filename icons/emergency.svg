<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="emergGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F44336;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Warning triangle -->
  <path d="M 50 15 L 85 75 L 15 75 Z" fill="url(#emergGrad)" stroke="#fff" stroke-width="3"/>
  <!-- Exclamation mark -->
  <line x1="50" y1="35" x2="50" y2="55" stroke="white" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="65" r="3" fill="white"/>
  <!-- Pulse effect -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#F44336" stroke-width="2" opacity="0.3">
    <animate attributeName="r" values="40;50;40" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
