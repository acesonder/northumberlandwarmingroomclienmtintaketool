<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="setGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#607D8B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#455A64;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Gear -->
  <circle cx="50" cy="50" r="20" fill="url(#setGrad)"/>
  <circle cx="50" cy="50" r="12" fill="white" opacity="0.3"/>
  <!-- Gear teeth -->
  <rect x="47" y="15" width="6" height="12" rx="2" fill="url(#setGrad)"/>
  <rect x="47" y="73" width="6" height="12" rx="2" fill="url(#setGrad)"/>
  <rect x="15" y="47" width="12" height="6" rx="2" fill="url(#setGrad)"/>
  <rect x="73" y="47" width="12" height="6" rx="2" fill="url(#setGrad)"/>
  <rect x="25" y="23" width="10" height="6" rx="2" fill="url(#setGrad)" transform="rotate(45 30 26)"/>
  <rect x="65" y="23" width="10" height="6" rx="2" fill="url(#setGrad)" transform="rotate(-45 70 26)"/>
  <rect x="25" y="71" width="10" height="6" rx="2" fill="url(#setGrad)" transform="rotate(-45 30 74)"/>
  <rect x="65" y="71" width="10" height="6" rx="2" fill="url(#setGrad)" transform="rotate(45 70 74)"/>
  <!-- Rotation animation -->
  <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite"/>
</svg>
