<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Plate -->
  <ellipse cx="50" cy="65" rx="35" ry="8" fill="url(#foodGrad)"/>
  <ellipse cx="50" cy="63" rx="35" ry="8" fill="white" opacity="0.3"/>
  <!-- Food items -->
  <circle cx="40" cy="50" r="8" fill="#FF6B6B"/>
  <circle cx="55" cy="48" r="9" fill="#4CAF50"/>
  <circle cx="50" cy="55" r="7" fill="#FFD93D"/>
  <!-- Fork -->
  <line x1="20" y1="35" x2="20" y2="60" stroke="#607D8B" stroke-width="3" stroke-linecap="round"/>
  <line x1="17" y1="35" x2="17" y2="45" stroke="#607D8B" stroke-width="2" stroke-linecap="round"/>
  <line x1="23" y1="35" x2="23" y2="45" stroke="#607D8B" stroke-width="2" stroke-linecap="round"/>
  <!-- Knife -->
  <line x1="80" y1="35" x2="80" y2="60" stroke="#607D8B" stroke-width="3" stroke-linecap="round"/>
  <path d="M 78 35 L 80 30 L 82 35" fill="#607D8B"/>
</svg>
