<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="transGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Bus/vehicle -->
  <rect x="20" y="35" width="60" height="35" rx="5" fill="url(#transGrad)"/>
  <!-- Windows -->
  <rect x="27" y="42" width="18" height="12" rx="2" fill="#E3F2FD"/>
  <rect x="55" y="42" width="18" height="12" rx="2" fill="#E3F2FD"/>
  <!-- Wheels -->
  <circle cx="32" cy="72" r="8" fill="#333"/>
  <circle cx="32" cy="72" r="5" fill="#607D8B"/>
  <circle cx="68" cy="72" r="8" fill="#333"/>
  <circle cx="68" cy="72" r="5" fill="#607D8B"/>
  <!-- Front lights -->
  <circle cx="25" cy="60" r="3" fill="#FFD93D"/>
  <circle cx="75" cy="60" r="3" fill="#FFD93D"/>
  <!-- Movement lines -->
  <line x1="10" y1="25" x2="20" y2="25" stroke="#2196F3" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <animate attributeName="x1" values="10;5" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="20;15" dur="0.8s" repeatCount="indefinite"/>
  </line>
  <line x1="10" y1="32" x2="25" y2="32" stroke="#2196F3" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <animate attributeName="x1" values="10;5" dur="0.8s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="25;20" dur="0.8s" begin="0.2s" repeatCount="indefinite"/>
  </line>
</svg>
