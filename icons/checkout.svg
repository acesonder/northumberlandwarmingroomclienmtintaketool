<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="outGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Door/entrance -->
  <rect x="25" y="20" width="50" height="65" rx="5" fill="url(#outGrad)"/>
  <rect x="35" y="30" width="30" height="40" rx="3" fill="#E3F2FD" opacity="0.3"/>
  <!-- Arrow exiting -->
  <path d="M 65 50 L 85 50 L 80 45 M 85 50 L 80 55" stroke="#FFD93D" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Wave goodbye -->
  <path d="M 45 35 Q 40 32 40 28" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
